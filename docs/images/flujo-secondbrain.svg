<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description">
  <title id="title">Flujo de trabajo de SecondBrain-CryptoADA</title>
  <desc id="description">El usuario guarda una fuente y sus metadatos en RAW; el asistente elabora fichas y páginas relacionadas en la wiki; se revisan índices, visión general y registro para consultar y conservar análisis con referencias.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#45627f"/></marker>
  </defs>
  <rect width="1080" height="350" rx="18" fill="#f3f6fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="43" font-size="27" font-weight="700" fill="#14253d">De una fuente a conocimiento trazable</text>
    <text x="32" y="71" font-size="17" fill="#45627f">El usuario solicita la incorporación; el asistente sigue las reglas de AGENTS.md.</text>
    <rect x="32" y="101" width="310" height="180" rx="12" fill="#ffffff" stroke="#bccce2"/>
    <rect x="385" y="101" width="310" height="180" rx="12" fill="#ffffff" stroke="#bccce2"/>
    <rect x="738" y="101" width="310" height="180" rx="12" fill="#ffffff" stroke="#bccce2"/>
    <path d="M349 190H375" fill="none" stroke="#45627f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M702 190H728" fill="none" stroke="#45627f" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="61" cy="133" r="17" fill="#175cd3"/>
    <circle cx="414" cy="133" r="17" fill="#0b7569"/>
    <circle cx="767" cy="133" r="17" fill="#5943aa"/>
    <g text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><text x="61" y="139">1</text><text x="414" y="139">2</text><text x="767" y="139">3</text></g>
    <g font-size="22" font-weight="700" fill="#14253d"><text x="87" y="140">Conservar · RAW</text><text x="440" y="140">Elaborar · Wiki</text><text x="793" y="140">Revisar y consultar</text></g>
    <g font-size="18" fill="#334b65">
      <text x="53" y="181">Documento, datos y metadatos</text>
      <text x="53" y="215">Originales sin modificar</text>
      <text x="53" y="249">Revisiones en archivos nuevos</text>
      <text x="406" y="181">Ficha de fuente y referencias</text>
      <text x="406" y="215">Entidades, conceptos y temas</text>
      <text x="406" y="249">Hechos, atribuciones y lagunas</text>
      <text x="759" y="181">Índices, visión general y registro</text>
      <text x="759" y="215">Informes y comparaciones</text>
      <text x="759" y="249">Consultas con fuentes trazables</text>
    </g>
    <text x="32" y="320" font-size="17" fill="#45627f">templates/ ayuda a redactar · wiki/index.md permite navegar · wiki/log.md conserva las operaciones</text>
  </g>
</svg>
